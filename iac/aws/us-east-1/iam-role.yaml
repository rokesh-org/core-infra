AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Task Role Stack for Application container

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  SampleIAMTaskStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://abc.cf.ecs.template.nonprod.s3.us-east-1.amazonaws.com/templates/iam-task.yaml
      Parameters:
        Environment: !Ref Environment
        AppName: Sample
        AppPolicyArn: !Sub '{{resolve:ssm:/cfn/dev/iam/Sample/PolicyArn:1}}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ── Sampleservice IAM Task Stack ─────────────────────────────────────────
  SampleserviceIAMTaskStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://rpx.cf.ecs.template.nonprod.s3.us-east-1.amazonaws.com/templates/iam-task.yaml
      Parameters:
        Environment: !Ref Environment
        AppName: sample-service
        AppPolicyArn: !Sub '{{resolve:ssm:/cfn/qa/iam/sample-service/PolicyArn:1}}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation