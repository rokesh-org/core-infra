
  # ── Sampleservice Route53 Task Stack ─────────────────────────────────────────
  SampleserviceRoute53Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://rpx.cf.ecs.template.nonprod.s3.us-east-1.amazonaws.com/templates/route53_records.yaml
      Parameters:
        Environment: !Ref Environment
        AppName: sample-service
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation