
  # ── __CF_APP_NAME__ Route53 Task Stack ─────────────────────────────────────────
  __CF_APP_NAME__Route53Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://rpx.cf.ecs.template.nonprod.s3.us-east-1.amazonaws.com/templates/route53_records.yaml
      Parameters:
        Environment: !Ref Environment
        AppName: __APP_NAME__
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation