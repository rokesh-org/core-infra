name: 'Application CI UI Setup'
description: 'Setup CI pipeline for UI application'

inputs:
  app-name:
    description: 'Application name'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  environment:
    description: 'Environment (dev-i, qa-i, stage-i, prod-i)'
    required: true
  ui-branch-name:
    description: 'UI source branch name'
    required: true
  ui-target-branch-name:
    description: 'UI target branch name for PR'
    required: true
  templates-path:
    description: 'Path to templates repository'
    required: true
  gh-token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  pr-url:
    description: 'Pull Request URL'
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup git configuration
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout application repository (UI)
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repo-name }}
        ref: ${{ inputs.ui-branch-name }}
        path: ui-repo
        token: ${{ inputs.gh-token }}

    - name: Create UI onboarding branch
      shell: bash
      run: |
        cd ui-repo
        git checkout -b onboard/ui/${{ inputs.app-name }}
        echo "✓ Created branch: onboard/ui/${{ inputs.app-name }}"

    - name: Copy UI CI template files
      shell: bash
      run: |
        cd ui-repo
        rsync -av --exclude='.git' ${{ inputs.templates-path }}/template-files/app-ci/ .
        echo "✓ Copied CI template files for UI"
        ls -la

    - name: Extract Ruby version from template
      id: ruby-version
      shell: bash
      run: |
        if [ -f "${{ inputs.templates-path }}/template-files/app-ci/.ruby-version" ]; then
          RUBY_VERSION=$(cat ${{ inputs.templates-path }}/template-files/app-ci/.ruby-version)
          echo "ruby_version=${RUBY_VERSION}" >> $GITHUB_OUTPUT
          echo "✓ Ruby version: ${RUBY_VERSION}"
        else
          echo "ruby_version=3.2.0" >> $GITHUB_OUTPUT
          echo "⚠ Ruby version file not found, using default: 3.2.0"
        fi

    - name: Replace placeholders in UI files
      shell: bash
      run: |
        cd ui-repo
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__APP_NAME__|${{ inputs.app-name }}-ui|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__REPO_NAME__|${{ inputs.repo-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__RUBY_VERSION__|${{ steps.ruby-version.outputs.ruby_version }}|g" {} +
        echo "✓ Placeholders replaced for UI"

    - name: Commit UI CI changes
      shell: bash
      run: |
        cd ui-repo
        git add .
        git commit -m "feat(ci): onboard ${{ inputs.app-name }} UI pipeline" || echo "No changes to commit"
        echo "✓ Committed UI CI changes"

    - name: Push UI onboarding branch
      shell: bash
      run: |
        cd ui-repo
        git push origin onboard/ui/${{ inputs.app-name }}
        echo "✓ Pushed UI onboarding branch"

    - name: Create UI CI Pull Request
      id: create-pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        cd ui-repo
        PR_URL=$(gh pr create \
          --title "feat(ci): onboard ${{ inputs.app-name }} UI pipeline" \
          --body "## Application Onboarding - CI Pipeline (UI)

**Application:** ${{ inputs.app-name }}  
**Repository:** ${{ inputs.repo-name }}  
**Onboarding Type:** Application CI Setup (UI)  
**Branch:** onboard/ui/${{ inputs.app-name }}  

### Generated Resources
- CI Pipeline workflow files for UI
- Docker configuration
- Docker entry point script

### Validation Checklist
- [ ] Review generated CI pipeline workflow
- [ ] Verify Docker configuration
- [ ] Verify entry point script
- [ ] Test CI pipeline execution

**Note:** This PR was automatically generated by the Application Onboarding workflow." \
          --base "${{ inputs.ui-target-branch-name }}" \
          --head "onboard/ui/${{ inputs.app-name }}" \
          2>&1 || echo "FAILED")
        
        echo "pr-url=${PR_URL}" >> $GITHUB_OUTPUT
        echo "✓ Created UI CI PR: ${PR_URL}"
