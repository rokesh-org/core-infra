name: 'Infrastructure CD Setup'
description: 'Setup infrastructure CD deployment for core_infrastructure repository'

inputs:
  app-name:
    description: 'Application name'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  environment:
    description: 'Environment (dev, qa, stage, prod)'
    required: true
  environment-branch:
    description: 'Environment branch name (dev-i, qa-i, stage-i, prod-i)'
    required: true
  templates-path:
    description: 'Path to templates repository'
    required: true
  gh-token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  pr-url:
    description: 'Pull Request URL'
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup git configuration
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout core_infrastructure repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/core_infra
        ref: main
        path: infra-repo
        token: ${{ inputs.gh-token }}

    - name: Ensure and checkout environment branch
      shell: bash
      run: |
        cd infra-repo
        if ! git ls-remote --heads origin ${{ inputs.environment-branch }} | grep -q .; then
          git checkout -b ${{ inputs.environment-branch }}
          git push origin ${{ inputs.environment-branch }}
        fi
        git fetch origin
        git checkout ${{ inputs.environment-branch }}

    - name: Setup infrastructure onboarding files
      shell: bash
      run: |
        cd infra-repo
        mkdir -p iac/aws/us-east-1

    - name: Process infrastructure templates and placeholders
      shell: bash
      run: |
        cd infra-repo
        TEMPLATES=("ecr.yaml" "iam-policy.yaml" "iam-role.yaml" "route53.yaml" "s3.yaml" "secret-manager.yaml")
        for template in "${TEMPLATES[@]}"; do
          src="${{ inputs.templates-path }}/template-files/infra-cd/${template}"
          tgt="iac/aws/us-east-1/${template}"
          [ -f "${src}" ] && ([ -f "${tgt}" ] && cat "${src}" >> "${tgt}" || cp "${src}" "${tgt}")
        done
        find iac/aws/us-east-1 -type f -name '*.yaml' -exec sed -i "s|__APP_NAME__|${{ inputs.app-name }}|g" {} +
        find iac/aws/us-east-1 -type f -name '*.yaml' -exec sed -i "s|__CF_APP_NAME__|$(echo ${{ inputs.app-name }} | sed 's/-//g')|g" {} +
        find iac/aws/us-east-1 -type f -name '*.yaml' -exec sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" {} +
        find iac/aws/us-east-1 -type f -name '*.yaml' -exec sed -i "s|__REPO_NAME__|${{ inputs.repo-name }}|g" {} +

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.gh-token }}
        path: infra-repo
        base: ${{ inputs.environment-branch }}
        branch: infra/${{ inputs.environment-branch }}/${{ inputs.app-name }}
        delete-branch: true
        commit-message: |
          feat(infra): onboard ${{ inputs.app-name }} infrastructure
        title: "feat(infra): onboard ${{ inputs.app-name }} infrastructure"
        body: |
          ## Infrastructure Onboarding

          **Application:** ${{ inputs.app-name }}
          **Repository:** ${{ inputs.repo-name }}
          **Environment:** ${{ inputs.environment-branch }}
          **Onboarding Type:** Infrastructure CD Setup
          **Branch:** infra/${{ inputs.environment-branch }}/${{ inputs.app-name }}

          ### Generated Resources
          - ECR configuration (ecr.yaml)
          - IAM policies (iam-policy.yaml)
          - IAM roles (iam-role.yaml)
          - Route53 configuration (route53.yaml)
          - S3 configuration (s3.yaml)
          - Secrets Manager configuration (secret-manager.yaml)

          ### Validation Checklist
          - [ ] Review ECR configuration
          - [ ] Review IAM policies and roles
          - [ ] Review Route53 DNS configuration
          - [ ] Review S3 bucket configuration
          - [ ] Review Secrets Manager configuration
          - [ ] Validate CloudFormation stack definitions
          - [ ] Test infrastructure deployment

          **Note:** This PR was automatically generated by the Application Onboarding workflow.
