name: 'Application CD Setup'
description: 'Setup CD deployment pipeline for application'

inputs:
  app-name:
    description: 'Application name'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  environment:
    description: 'Environment (dev, qa, stage, prod)'
    required: true
  environment-branch:
    description: 'Environment branch name (dev-i, qa-i, stage-i, prod-i)'
    required: true
  templates-path:
    description: 'Path to templates repository'
    required: true
  gh-token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  pr-url:
    description: 'Pull Request URL'
    value: ${{ steps.create-pr.outputs.pull-request-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup git configuration
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout application repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repo-name }}
        ref: main
        path: app-cd-repo
        token: ${{ inputs.gh-token }}

    - name: Ensure and checkout environment branch
      shell: bash
      run: |
        cd app-cd-repo
        if ! git ls-remote --heads origin ${{ inputs.environment-branch }} | grep -q .; then
          git checkout -b ${{ inputs.environment-branch }}
          git push origin ${{ inputs.environment-branch }}
        fi
        git fetch origin
        git checkout ${{ inputs.environment-branch }}

    - name: Setup CD onboarding files
      shell: bash
      run: |
        cd app-cd-repo
        find . -maxdepth 1 -type f ! -name '.gitignore' -delete
        find . -maxdepth 1 -type d ! -name '.' ! -name '..' ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
        rsync -av --exclude='.git' ${{ inputs.templates-path }}/templates/app-cd/ .

    - name: Replace placeholders
      shell: bash
      run: |
        cd app-cd-repo
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__APP_NAME__|${{ inputs.app-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__REPO_NAME__|${{ inputs.repo-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__CF_APP_NAME__|$(echo ${{ inputs.app-name }} | sed 's/-//g' | sed 's/^./\U&/')|g" {} +
        find . -name '*api*' -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__TYPE__|api|g" {} +
        find . -name '*ui*' -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__TYPE__|ui|g" {} +

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.gh-token }}
        path: app-cd-repo
        base: ${{ inputs.environment-branch }}
        branch: ${{ inputs.environment-branch }}-on-board
        delete-branch: true
        commit-message: |
          feat(cd): onboard ${{ inputs.app-name }} deployment
        title: "feat(cd): onboard ${{ inputs.app-name }} into ${{ inputs.environment-branch }}"
        body: |
          ## Application Onboarding - CD Pipeline

          **Application:** ${{ inputs.app-name }}
          **Repository:** ${{ inputs.repo-name }}
          **Environment:** ${{ inputs.environment-branch }}
          **Onboarding Type:** Application CD Setup
          **Branch:** ${{ inputs.environment-branch }}-on-board

          ### Generated Resources
          - CD Deployment workflow configuration
          - Infrastructure as Code (IaC) manifests for API
          - Infrastructure as Code (IaC) manifests for UI
          - Configuration files (api-config.yaml, ui-config.yaml)

          ### Validation Checklist
          - [ ] Review CD deployment workflow
          - [ ] Verify infrastructure manifests
          - [ ] Verify configuration files
          - [ ] Validate environment-specific settings
          - [ ] Test deployment workflow

          **Note:** This PR was automatically generated by the Application Onboarding workflow.
