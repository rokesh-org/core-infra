name: 'Application CD Setup'
description: 'Setup CD deployment pipeline for application'

inputs:
  app-name:
    description: 'Application name'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  environment:
    description: 'Environment (dev, qa, stage, prod)'
    required: true
  environment-branch:
    description: 'Environment branch name (dev-i, qa-i, stage-i, prod-i)'
    required: true
  templates-path:
    description: 'Path to templates repository'
    required: true
  gh-token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  pr-url:
    description: 'Pull Request URL'
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup git configuration
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout application repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repo-name }}
        ref: main
        path: app-cd-repo
        token: ${{ inputs.gh-token }}

    - name: Check if environment branch exists
      id: check-env-branch
      shell: bash
      run: |
        cd app-cd-repo
        if git ls-remote --heads origin ${{ inputs.environment-branch }} | grep -q .; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✓ Environment branch exists: ${{ inputs.environment-branch }}"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠ Environment branch does not exist: ${{ inputs.environment-branch }}"
        fi

    - name: Create environment branch if not exists
      if: steps.check-env-branch.outputs.exists == 'false'
      shell: bash
      run: |
        cd app-cd-repo
        git checkout -b ${{ inputs.environment-branch }}
        git push origin ${{ inputs.environment-branch }}
        echo "✓ Created environment branch: ${{ inputs.environment-branch }}"

    - name: Checkout environment branch
      shell: bash
      run: |
        cd app-cd-repo
        git fetch origin
        git checkout ${{ inputs.environment-branch }}
        echo "✓ Checked out environment branch"

    - name: Create CD onboarding branch
      shell: bash
      run: |
        cd app-cd-repo
        git checkout -b ${{ inputs.environment-branch }}-on-board
        echo "✓ Created branch: ${{ inputs.environment-branch }}-on-board"

    - name: Preview existing files
      shell: bash
      run: |
        cd app-cd-repo
        echo "=== Current files ==="
        ls -la

    - name: Remove existing files
      shell: bash
      run: |
        cd app-cd-repo
        rm -rf ./* ./.*  2>/dev/null || true
        echo "✓ Removed existing files"

    - name: Copy CD template files
      shell: bash
      run: |
        cd app-cd-repo
        rsync -av --exclude='.git' ${{ inputs.templates-path }}/template-files/app-cd/ .
        echo "✓ Copied CD template files"

    - name: Preview files after copy
      shell: bash
      run: |
        cd app-cd-repo
        echo "=== Files after copy ==="
        ls -la

    - name: Replace placeholders in CD files
      shell: bash
      run: |
        cd app-cd-repo
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__APP_NAME__|${{ inputs.app-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__REPO_NAME__|${{ inputs.repo-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" {} +
        echo "✓ Placeholders replaced in CD files"

    - name: Commit CD changes
      shell: bash
      run: |
        cd app-cd-repo
        git add .
        git commit -m "feat(cd): onboard ${{ inputs.environment }}-${{ inputs.app-name }} deployment" || echo "No changes to commit"
        echo "✓ Committed CD changes"

    - name: Push CD onboarding branch
      shell: bash
      run: |
        cd app-cd-repo
        git push origin ${{ inputs.environment-branch }}-on-board
        echo "✓ Pushed CD onboarding branch"

    - name: Create CD Pull Request
      id: create-pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        cd app-cd-repo
        PR_URL=$(gh pr create \
          --title "feat(cd): onboard ${{ inputs.app-name }} into ${{ inputs.environment-branch }}" \
          --body "## Application Onboarding - CD Pipeline

**Application:** ${{ inputs.app-name }}  
**Repository:** ${{ inputs.repo-name }}  
**Environment:** ${{ inputs.environment-branch }}  
**Onboarding Type:** Application CD Setup  
**Branch:** ${{ inputs.environment-branch }}-on-board  

### Generated Resources
- CD Deployment workflow configuration
- Infrastructure as Code (IaC) manifests for API
- Infrastructure as Code (IaC) manifests for UI
- Configuration files (api-config.yaml, ui-config.yaml)

### Validation Checklist
- [ ] Review CD deployment workflow
- [ ] Verify infrastructure manifests
- [ ] Verify configuration files
- [ ] Validate environment-specific settings
- [ ] Test deployment workflow

**Note:** This PR was automatically generated by the Application Onboarding workflow." \
          --base "${{ inputs.environment-branch }}" \
          --head "${{ inputs.environment }}-on-board" \
          2>&1 || echo "FAILED")
        
        echo "pr-url=${PR_URL}" >> $GITHUB_OUTPUT
        echo "✓ Created CD PR: ${PR_URL}"
