name: 'Application CI Setup'
description: 'Setup CI pipeline for API or UI application'

inputs:
  app-name:
    description: 'Application name'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  environment:
    description: 'Environment (dev, qa, stage, prod)'
    required: true
  branch-name:
    description: 'Source branch name'
    required: true
  target-branch-name:
    description: 'Target branch name for PR'
    required: true
  templates-path:
    description: 'Path to templates repository'
    required: true
  gh-token:
    description: 'GitHub token for authentication'
    required: true
  is-ui:
    description: 'Is this a UI application setup (true/false)'
    required: false
    default: 'false'

outputs:
  pr-url:
    description: 'Pull Request URL'
    value: ${{ steps.create-pr.outputs.pull-request-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup git configuration
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine app type
      id: app-type
      shell: bash
      run: |
        if [ "${{ inputs.is-ui }}" = "true" ]; then
          echo "type=ui" >> $GITHUB_OUTPUT
          echo "dir=ui-repo" >> $GITHUB_OUTPUT
          echo "name=${{ inputs.app-name }}-ui" >> $GITHUB_OUTPUT
        else
          echo "type=api" >> $GITHUB_OUTPUT
          echo "dir=app-repo" >> $GITHUB_OUTPUT
          echo "name=${{ inputs.app-name }}" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repo-name }}
        ref: ${{ inputs.target-branch-name }}
        path: ${{ steps.app-type.outputs.dir }}
        token: ${{ inputs.gh-token }}

    - name: Copy CI template files
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        rsync -av --exclude='.git' ${{ inputs.templates-path }}/templates/app-ci/${{ steps.app-type.outputs.type }}/ .

    - name: Extract Ruby version
      id: ruby-version
      shell: bash
      run: |
        RUBY_FILE="${{ steps.app-type.outputs.dir }}/.ruby-version"
        if [ -f "$RUBY_FILE" ]; then
          RUBY_VERSION=$(cat "$RUBY_FILE")
        else
          RUBY_VERSION="3.2.0"
        fi
        echo "ruby_version=${RUBY_VERSION}" >> $GITHUB_OUTPUT

    - name: Replace placeholders
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' -o -name 'nginx.conf' \) -exec sed -i "s|__APP_NAME__|${{ steps.app-type.outputs.name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' -o -name 'nginx.conf' \) -exec sed -i "s|__REPO_NAME__|${{ inputs.repo-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' -o -name 'nginx.conf' \) -exec sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' -o -name 'nginx.conf' \) -exec sed -i "s|__RUBY_VERSION__|${{ steps.ruby-version.outputs.ruby_version }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i "s|__TYPE__|${{ steps.app-type.outputs.type }}|g" {} +

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.gh-token }}
        path: ${{ steps.app-type.outputs.dir }}
        base: ${{ inputs.target-branch-name }}
        branch: onboard/${{ steps.app-type.outputs.type }}/${{ inputs.app-name }}
        delete-branch: true
        commit-message: |
          feat(ci): onboard ${{ steps.app-type.outputs.name }} pipeline
        title: "feat(ci): onboard ${{ steps.app-type.outputs.name }} pipeline"
        body: |
          ## Application Onboarding - CI Pipeline (${{ steps.app-type.outputs.type }})

          **Application:** ${{ steps.app-type.outputs.name }}
          **Repository:** ${{ inputs.repo-name }}
          **Branch:** onboard/${{ steps.app-type.outputs.type }}/${{ inputs.app-name }}

          ### Generated Resources
          - CI Pipeline workflow
          - Docker configuration
          - Entry point script

          ### Validation Checklist
          - [ ] Review generated pipeline
          - [ ] Verify Docker configuration
          - [ ] Test execution

          *Auto-generated by Application Onboarding workflow*
