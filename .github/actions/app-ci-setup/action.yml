name: 'Application CI Setup'
description: 'Setup CI pipeline for API or UI application'

inputs:
  app-name:
    description: 'Application name'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  environment:
    description: 'Environment (dev, qa, stage, prod)'
    required: true
  branch-name:
    description: 'Source branch name'
    required: true
  target-branch-name:
    description: 'Target branch name for PR'
    required: true
  templates-path:
    description: 'Path to templates repository'
    required: true
  gh-token:
    description: 'GitHub token for authentication'
    required: true
  is-ui:
    description: 'Is this a UI application setup (true/false)'
    required: false
    default: 'false'

outputs:
  pr-url:
    description: 'Pull Request URL'
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup git configuration
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine app type
      id: app-type
      shell: bash
      run: |
        if [ "${{ inputs.is-ui }}" = "true" ]; then
          echo "type=ui" >> $GITHUB_OUTPUT
          echo "dir=ui-repo" >> $GITHUB_OUTPUT
          echo "name=${{ inputs.app-name }}-ui" >> $GITHUB_OUTPUT
        else
          echo "type=api" >> $GITHUB_OUTPUT
          echo "dir=app-repo" >> $GITHUB_OUTPUT
          echo "name=${{ inputs.app-name }}" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repo-name }}
        ref: ${{ inputs.branch-name }}
        path: ${{ steps.app-type.outputs.dir }}
        token: ${{ inputs.gh-token }}

    - name: Create onboarding branch
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        git checkout -b onboard/${{ steps.app-type.outputs.type }}/${{ inputs.app-name }}

    - name: Copy CI template files
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        rsync -av --exclude='.git' ${{ inputs.templates-path }}/template-files/app-ci/ .

    - name: Extract Ruby version
      id: ruby-version
      shell: bash
      run: |
        RUBY_FILE="${{ steps.app-type.outputs.dir }}/.ruby-version"
        if [ -f "$RUBY_FILE" ]; then
          RUBY_VERSION=$(cat "$RUBY_FILE")
        else
          RUBY_VERSION="3.2.0"
        fi
        echo "ruby_version=${RUBY_VERSION}" >> $GITHUB_OUTPUT

    - name: Replace placeholders
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__APP_NAME__|${{ steps.app-type.outputs.name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__REPO_NAME__|${{ inputs.repo-name }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" {} +
        find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name 'Dockerfile' -o -name 'docker-entrypoint' \) -exec sed -i "s|__RUBY_VERSION__|${{ steps.ruby-version.outputs.ruby_version }}|g" {} +

    - name: Commit changes
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        git add . && git commit -m "feat(ci): onboard ${{ steps.app-type.outputs.name }} pipeline" || true

    - name: Push onboarding branch
      shell: bash
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        git push origin onboard/${{ steps.app-type.outputs.type }}/${{ inputs.app-name }}

    - name: Create Pull Request
      id: create-pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        cd ${{ steps.app-type.outputs.dir }}
        PR_URL=$(gh pr create \
          --title "feat(ci): onboard ${{ steps.app-type.outputs.name }} pipeline" \
          --body "## Application Onboarding - CI Pipeline (${{ steps.app-type.outputs.type }})" \
          --body "**Application:** ${{ steps.app-type.outputs.name }}" \
          --body "**Repository:** ${{ inputs.repo-name }}" \
          --body "**Branch:** onboard/${{ steps.app-type.outputs.type }}/${{ inputs.app-name }}" \
          --body "### Generated Resources" \
          --body "- CI Pipeline workflow" \
          --body "- Docker configuration" \
          --body "- Entry point script" \
          --body "### Validation Checklist" \
          --body "- [ ] Review generated pipeline" \
          --body "- [ ] Verify Docker configuration" \
          --body "- [ ] Test execution" \
          --body "*Auto-generated by Application Onboarding workflow*" \
          --base "${{ inputs.target-branch-name }}" \
          --head "onboard/${{ steps.app-type.outputs.type }}/${{ inputs.app-name }}" \
          2>&1)
        
        echo "pr-url=${PR_URL}" >> $GITHUB_OUTPUT
