name: Monthly AMI Update

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write 
   
jobs:
  update-ami:
    runs-on: codebuild-ecs-cf-workflow-${{ github.run_id }}-${{ github.run_attempt }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev-i
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.1"
          curl -sL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_arm64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Fetch latest AMI from SSM
        id: get_ami
        run: |
          LATEST_AMI=$(aws ssm get-parameters \
            --names /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id \
            --region us-east-1 \
            --query "Parameters[0].Value" \
            --output text)

          [[ -z "$LATEST_AMI" || "$LATEST_AMI" == "None" ]] && { echo "ERROR: Failed to retrieve AMI"; exit 1; }
          echo "Latest AMI: $LATEST_AMI"
          echo "ami_id=$LATEST_AMI" >> "$GITHUB_OUTPUT"

      - name: Read current AMI from template
        id: current_ami
        run: |
          CURRENT_AMI=$(yq '.Resources.ECSStack.Properties.Parameters.AmiId' iac/aws/us-east-1/ecs-cluster.yaml)
          echo "Current AMI: $CURRENT_AMI"
          echo "ami_id=$CURRENT_AMI" >> "$GITHUB_OUTPUT"

      - name: Check if AMI has changed
        id: ami_diff
        run: |
          if [ "${{ steps.get_ami.outputs.ami_id }}" = "${{ steps.current_ami.outputs.ami_id }}" ]; then
            echo "AMI is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "AMI changed: ${{ steps.current_ami.outputs.ami_id }} -> ${{ steps.get_ami.outputs.ami_id }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update AMI in ecs-cluster.yaml
        if: steps.ami_diff.outputs.changed == 'true'
        run: |
          LATEST="${{ steps.get_ami.outputs.ami_id }}"
          yq -i '.Resources.ECSStack.Properties.Parameters.AmiId = "'"$LATEST"'"' iac/aws/us-east-1/ecs-cluster.yaml
          yq -i '.Resources.ECSStack.Properties.Parameters.AmiId line_comment = "Amazon Linux 2023 ARM64"' iac/aws/us-east-1/ecs-cluster.yaml

      - name: Create Pull Request - Dev Branch
        if: steps.ami_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          base: dev-i
          branch: "chore/ami-update-${{ steps.get_ami.outputs.ami_id }}"
          delete-branch: true
          add-paths: iac/aws/us-east-1/ecs-cluster.yaml
          commit-message: "chore: update ECS AMI to ${{ steps.get_ami.outputs.ami_id }}"
          title: "chore: Monthly AMI update -> ${{ steps.get_ami.outputs.ami_id }}"
          body: |
            ## Monthly AMI Update

            This PR was automatically generated by the **Monthly AMI Update** workflow.

            ### AMI Changes
            | | Value |
            |---|---|
            | **Previous AMI** | `${{ steps.current_ami.outputs.ami_id }}` |
            | **New AMI** | `${{ steps.get_ami.outputs.ami_id }}` |
            | **AMI Type** | Amazon Linux 2023 ARM64 |
            | **Region** | `us-east-1` |
            | **SSM Parameter** | `/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64` |

            ### Files Changed
            - `iac/aws/us-east-1/ecs-cluster.yaml` — Updated `AmiId` parameter

            ### AMI Changelog
            > Review what changed between the two AMIs before merging.
            - 🔗 [Amazon Linux 2023 Release Notes](https://docs.aws.amazon.com/linux/al2023/release-notes/relnotes.html)
            - 🔗 [Compare AMIs in EC2 Console](https://console.aws.amazon.com/ec2/v2/home?region=us-east-1#Images)

            ### Next Steps
            - [ ] Review the AMI changelog for any breaking changes
            - [ ] Verify the AMI is compatible with your ECS instance type (`t4g.medium`)
            - [ ] Confirm ECS launch template will pick up the new AMI on next instance refresh
            - [ ] Verify no custom bootstrapping scripts are affected
            - [ ] Approve and merge to apply the update

            ---
            *Triggered by [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          labels: |
            ami-update
            automated
            infrastructure

      - name: No update needed
        if: steps.ami_diff.outputs.changed == 'false'
        run: echo "AMI is already up to date. No PR needed."
